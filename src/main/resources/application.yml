# Banking Application — Spring Boot Configuration
#
# This file is organized by concern.
# Each section is clearly labelled.

spring:
  application:
    name: banking-app

  # ================================================================
  # DATABASE
  # ================================================================
  datasource:
    url: jdbc:postgresql://localhost:5432/bankingdb
    username: bankuser
    password: bankpassword
    driver-class-name: org.postgresql.Driver
    hikari:
      # Connection pool sizing — keep it small for local development.
      # In production, tune based on load testing.
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: BankingHikariPool

  # ================================================================
  # JPA / HIBERNATE
  # ================================================================
  jpa:
    hibernate:
      # IMPORTANT: We use "validate" — not "create" or "update".
      # Flyway is responsible for ALL schema changes.
      # Hibernate only validates that entities match the schema.
      # This prevents accidental schema drift in production.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        # Default schema
        default_schema: public
        # Enable query statistics in development
        generate_statistics: false

  # ================================================================
  # FLYWAY — Database Migration
  # ================================================================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    # Each module owns its table prefix:
    # customer_* → customer module
    # account_*  → account module
    # etc.

  # ================================================================
  # JACKSON — JSON Serialization
  # ================================================================
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

# ================================================================
# SERVER
# ================================================================
server:
  port: 8080
  error:
    # We handle errors ourselves via @RestControllerAdvice.
    # Disable Spring Boot's default error page.
    whitelabel:
      enabled: false
    include-message: never
    include-binding-errors: never

# ================================================================
# ACTUATOR — Health, Info, Module Inspection
# ================================================================
management:
  endpoints:
    web:
      exposure:
        # Expose health, info, and the Spring Modulith endpoint.
        # In production, restrict this to internal networks only.
        include: health, info, modulith, metrics
  endpoint:
    health:
      show-details: when-authorized

# ================================================================
# LOGGING
# ================================================================
logging:
  level:
    com.bank: DEBUG
    org.springframework.modulith: DEBUG
    org.flywaydb: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n"
