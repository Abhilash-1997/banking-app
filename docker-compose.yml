# =============================================================================
# Banking Application — Docker Compose (Phase 2: Development)
# =============================================================================
#
# Starts only what we need right now:
#   - PostgreSQL database
#
# We deliberately do NOT start Kafka, Redis, etc. yet.
# Each service is added only when the application actually needs it.
# Starting with minimal infrastructure keeps development simple and fast.
#
# Usage:
#   docker compose up -d          # Start in background
#   docker compose down           # Stop and remove containers
#   docker compose down -v        # Stop AND delete volumes (clears DB data)
#   docker compose logs postgres  # View postgres logs
# =============================================================================

services:

  # ===========================================================================
  # PostgreSQL — Primary Database
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: banking-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: bankingdb
      POSTGRES_USER: bankuser
      POSTGRES_PASSWORD: bankpassword
      # Performance tuning for development
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"

    ports:
      # Host port 5432 → Container port 5432
      # The Spring Boot app connects to localhost:5432
      - "5432:5432"

    volumes:
      # Named volume for data persistence.
      # Data survives 'docker compose down' but not 'docker compose down -v'.
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      # Wait until PostgreSQL is ready to accept connections
      # before the Spring Boot app starts connecting.
      test: ["CMD-SHELL", "pg_isready -U bankuser -d bankingdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - banking-network

# =============================================================================
# Named Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  banking-network:
    driver: bridge
